<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sniplyze</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%232f6fe4%22/%3E%3Cpath d=%22M8 22l6-6 4 4 6-8%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Sniplyze</div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <label>Ubicación <input id="geo-location" type="number" min="1" inputmode="numeric"></label>
        <label>Idioma <input id="geo-language" type="text" maxlength="8"></label>
        <p class="hint">2724 / es = España, español</p>
      </div>
    </aside>

    <main class="main">
      <div id="banner" class="banner" hidden></div>
      <header class="tool-head">
        <h1 id="tool-title"></h1>
        <p id="tool-desc" class="muted"></p>
      </header>
      <form id="tool-form" class="tool-form" autocomplete="off"></form>
      <div id="status" class="status" hidden></div>
      <section id="output" class="output"></section>
    </main>
  </div>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <h2>Confirmar consulta de pago</h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">Cancelar</button>
        <button value="ok" id="confirm-ok">Confirmar y consultar</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
